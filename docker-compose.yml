services:
  triton:
    image: nvcr.io/nvidia/tritonserver:25.09-py3
    container_name: triton
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      tritonserver
      --model-repository=/models
      --log-verbose=1
      --model-control-mode=explicit
      --load-model=mnist
      --load-model=mnist_onnx
      --load-model=identity_gpu
      --load-model=identity_forward
      --load-model=mnist_stream
      --load-model=mnist_auto
      --load-model=mnist_steps
      --load-model=instance_details
      --load-model=device_blocking
      --load-model=cpu_parallel
      --trace-config=triton,file=/traces/trace.json
      --backend-config=custom_backend,greeting=hello
      --backend-config=custom_backend_device_blocking,greeting=hello
      --backend-config=custom_backend_device_blocking,execution-policy=device-blocking
    volumes:
      - ./models:/models
      - ./target/traces:/traces
      - ./target/release/libtriton_custom_backend.so:/opt/tritonserver/backends/custom_backend/libtriton_custom_backend.so
      - ./target/release/libtriton_custom_backend.so:/opt/tritonserver/backends/custom_backend_device_blocking/libtriton_custom_backend_device_blocking.so
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC
      - "8002:8002" # metrics (Prometheus)
