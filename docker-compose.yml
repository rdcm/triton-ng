services:
  triton:
    image: nvcr.io/nvidia/tritonserver:25.09-py3
    container_name: triton
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    # Host policies call set_mempolicy and pthread_setaffinity_np, which need
    # these capabilities in the container that Triton runs in.
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      tritonserver
      --model-repository=/models
      --log-verbose=1
      --model-control-mode=explicit
      --strict-readiness=false
      --load-model=mnist
      --load-model=fixture_errors
      --load-model=fixture_cancellation
      --load-model=fixture_tracing
      --load-model=fixture_bls_streaming
      --load-model=fixture_sender_refusal
      --load-model=fixture_shared_inputs
      --load-model=fixture_response_statistics
      --load-model=fixture_model_control
      --load-model=fixture_reschedule_refusal
      --load-model=fixture_backend_config
      --load-model=fixture_bls_mutation
      --load-model=fixture_policy_append
      --load-model=fixture_metadata
      --load-model=fixture_backend_state
      --load-model=fixture_memory_buffers
      --load-model=fixture_backend_state_other
      --load-model=host_policy_default
      --load-model=host_policy_batching
      --load-model=minimal_backend
      --load-model=minimal_batching
      --load-model=batch_strategy_example
      --load-model=minimal_backend_target
      --load-model=mnist_onnx
      --load-model=identity_gpu
      --load-model=identity_forward
      --load-model=mnist_stream
      --load-model=mnist_auto
      --load-model=mnist_steps
      --load-model=sequence_state
      --load-model=sequence_state_batched
      --load-model=sequence_state_other
      --load-model=instance_details
      --load-model=device_blocking
      --load-model=cpu_parallel
      --load-model=host_policy_pinned
      --load-model=host_policy_unknown
      --load-model=batch_strategy
      --trace-config=triton,file=/traces/trace.json
      --backend-config=custom_backend,greeting=hello
      --backend-config=custom_backend_device_blocking,greeting=hello
      --backend-config=custom_backend_device_blocking,execution-policy=device-blocking
      --host-policy=pinned,cpu-cores=0-7
      --host-policy=cpu,cpu-cores=0-7
    volumes:
      - ./target/release/libtriton_example_batch_strategy.so:/strategies/example-batchstrategy.so
      - ./target/release/libtriton_minimal_backend.so:/opt/tritonserver/backends/minimal_backend/libtriton_minimal_backend.so
      - ./models:/models
      - ./target/traces:/traces
      - ./target/release/libtriton_custom_backend.so:/opt/tritonserver/backends/custom_backend/libtriton_custom_backend.so
      - ./target/release/libtriton_custom_backend.so:/opt/tritonserver/backends/custom_backend_device_blocking/libtriton_custom_backend_device_blocking.so
      # Build first: Docker creates directories at missing library mount paths.
      - ./target/release/libtriton_batch_strategy.so:/strategies/batchstrategy.so
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC
      - "8002:8002" # metrics (Prometheus)
