[workspace]
resolver = "2"
members = [
    "example/app",
    "example/custom-backend",
    "tools/gen-grpc-client",
    "triton-ng",
    "triton-ng-client",
    "triton-ng-macros",
    "triton-ng-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["rdcm@protonmail.ch"]
license = "MIT"
readme = "README.md"
keywords = ["triton", "inference", "nvidia", "machine-learning", "grpc"]
repository = "https://github.com/rdcm/triton-ng"
rust-version = "1.99"
categories = ["api-bindings", "external-ffi-bindings", "network-programming", "science"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"

[workspace.dependencies]
anyhow = { version = "1.0.100" }
app = { path = "example/app", version = "0.1.0" }
bindgen = { version = "0.72.1" }
byteorder = { version = "1.5.0" }
config = { version = "0.15" }
custom-backend = { path = "example/custom-backend", version = "0.1.0" }
dotenvy = { version = "0.15" }
libc = { version = "0.2.177" }
prost = { version = "0.14.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tonic = { version = "0.14.2", features = ["gzip", "tls-ring", "tls-native-roots"] }
tonic-prost = { version = "0.14.2" }
tonic-prost-build = { version = "0.14.2" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
triton-ng = { path = "triton-ng", version = "0.1.0" }
triton-ng-client = { path = "triton-ng-client", version = "0.1.0" }
triton-ng-macros = { path = "triton-ng-macros", version = "0.1.0" }
triton-ng-sys = { path = "triton-ng-sys", version = "0.1.0" }
