[package]
name = "triton-ng"
version = "0.1.1"
edition = "2024"

[features]
cuda = ["dep:anyhow", "dep:half"]
cuda-dynamic = ["dep:anyhow", "dep:half", "dep:libloading"]

[dependencies]
anyhow = { workspace = true, optional = true }
half = { version = "2.7", optional = true }
libloading = { version = "0.8", optional = true }
byteorder = { workspace = true }
crossbeam = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
triton-ng-macros = { workspace = true }
triton-ng-sys = { workspace = true }

[lints]
workspace = true
